name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DepotAtelier-Android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q DepotAtelier-Android.zip
          ls -la DepotAtelier-Android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: DepotAtelier-Android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DepotAtelier-APK
          path: DepotAtelier-Android/app/build/outputs/apk/debug/app-debug.apk
